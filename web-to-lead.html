<!DOCTYPE html>
<html>

<head>
  <title>EdIntel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6">
  <h1 class="text-3xl font-semibold mb-4">EdIntel Form</h1>
  <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00DWU00000Kq4Qb"
    method="POST" class="bg-gray-100 p-6 rounded-lg shadow-md w-full max-w-md space-y-4">
    <META HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
    <input type=hidden name="oid" value="00DWU00000Kq4Qb">
    <!-- <input type="hidden" name="retURL"
      value="https://41a114eb-b07e-4959-89c5-faa5d39a789a-00-28bkjn5lfssco.pike.replit.dev/thankyou.html" />
    <input type="hidden" name="lead_source" value="Website" /> -->
    <!-- <input type="hidden" name="retURL"
      value="https://thantiwa153.github.io/WebTo/thankyou.html" /> -->
    <input type=hidden name="retURL" value="https://thantiwa153.github.io/WebTo/thankyou.html">
    <input type="hidden" name="lead_source" value="Website" />


    <div>
      <label for="first_name" class="block font-medium">*First Name</label>
      <input id="first_name" name="first_name" type="text" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label for="last_name" class="block font-medium">*Last Name</label>
      <input id="last_name" name="last_name" type="text" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label for="company" class="block font-medium">*Company (หากไม่มีโปรดกรอกนามสกุล)</label>
      <input id="company" name="company" type="text" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label for="email" class="block font-medium">*Email</label>
      <input id="email" name="email" type="email" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label for="phone" class="block font-medium">*Phone</label>
      <input id="phone" name="phone" type="tel" class="w-full p-2 border rounded" required />
    </div>

    <div class="form-group">
      <label for="branch">*Branch</label>
      <select id="branch" name="Branch__c" class="styled-select" required>
        <option value="">-- Please select --</option>
        <option value="Bangkapi">Bangkapi</option>
        <option value="Silom">Silom</option>
        <option value="Chaengwattana">Chaengwattana</option>
        <option value="Chonburi">Chonburi</option>
      </select>
    </div>

    <div class="form-group">
      <label for="age">*Age</label>
      <select id="age" name="Age__c" class="styled-select" required>
        <option value="">-- Please select --</option>
        <option value="9-12">9-12</option>
        <option value="13-18">13-18</option>
      </select>
    </div>

    <div class="form-group">
      <label for="interest_course">*Interest Course</label>
      <select id="interest_course" name="Interest_course__c" class="styled-select" required>
        <option value="">-- Please select --</option>
        <option value="Writing">Writing</option>
        <option value="Listening/Speaking">Listening/Speaking</option>
        <option value="IELTS">IELTS</option>
        <option value="Comprehensive">Comprehensive</option>
      </select>
    </div>

    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 w-full">Submit</button>
  </form>
</body>

</html>
