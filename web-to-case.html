<!DOCTYPE html>
<html>
<head>
  <title>Double M Request</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
  <META HTTP-EQUIV="Content-type" CONTENT="text/html; charset=UTF-8">
</head>
<body class="bg-white min-h-screen flex flex-col items-center justify-center p-6">
  <script src="script.js"></script>
  <h1 class="text-3xl font-semibold mb-4">Double M Request Form</h1>
  <form action="https://webto.salesforce.com/servlet/servlet.WebToCase?encoding=UTF-8&orgId=00DWU00000K5sc9" method="POST" class="bg-gray-100 p-6 rounded-lg shadow-md w-full max-w-md space-y-4">

    <input type=hidden name="orgid" value="00DWU00000K5sc9">
    <!-- <input type=hidden name="retURL" value="https://replit.com/@thantiwa/salesforce-web-demo/thankyou.html"> -->
    <!-- <input type="hidden" name="retURL" value="https://41a114eb-b07e-4959-89c5-faa5d39a789a-00-28bkjn5lfssco.pike.replit.dev/thankyou.html" /> -->
    <input type="hidden" name="retURL" value="https://thantiwa153.github.io/WebTo/thankyou.html" />


    <div>
      <label class="block font-medium">*Contact Name</label>
      <input name="name" type="text" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label class="block font-medium">*Email</label>
      <input name="email" type="email" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label class="block font-medium">*Phone</label>
      <input name="phone" type="tel" class="w-full p-2 border rounded" required />
    </div>

    <div class="form-group">
      <label for="region">*Region</label>
      <select id="region" name="Region__c" class="styled-select" required>
        <option value="">-- Please select --</option>
        <option value="North">North</option>
        <option value="Central">Central</option>
        <option value="South">South</option>
      </select>
    </div>

    <div class="form-group">
      <label for="category">*Category</label>
      <select id="category" name="Category__c" class="styled-select" required>
        <option value="">-- Please select --</option>
        <option value="Sales">Sales</option>
        <option value="General Enquiry">General Enquiry</option>
        <option value="Customer Feedback">Customer Feedback</option>
      </select>
    </div>

    <div class="form-group">
      <label for="subcategory">*Subcategory</label>
        <select id="subcategory" name="Sub_Category__c" class="styled-select" required disabled>
          <option value="">-- Select Category First --</option>
        <option value="Detail, Price, and Question">Detail, Price, and Question</option>
        <option value="Order New Product">Order New Product</option>
        <option value="Claim and Return">Claim and Return</option>
        <option value="Promotion">Promotion</option>
        <option value="Payment Channel">Payment Channel</option>
        <option value="Other">Other</option>
        <option value="Product">Product</option>
        <option value="Service andStaff">Service andStaff</option>
      </select>
    </div>
    
    <div>
      <label class="block font-medium">*Subject</label>
      <input name="subject" type="text" class="w-full p-2 border rounded" required />
    </div>

    <div>
      <label class="block font-medium">Description</label>
      <textarea name="description" class="w-full p-2 border rounded" rows="4"></textarea>
    </div>


    <button type="submit" class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 w-full">Submit Case</button>
  </form>
</body>
</html>

<script>
const subcategoryMap = {
  "Sales": [
    "Detail, Price, and Question",
    "Order New Product",
    "Claim and Return"
  ],
  "General Enquiry": [
    "Promotion",
    "Payment Channel",
    "Other"
  ],
  "Customer Feedback": [
    "Product",
    "Service andStaff"
  ]
};

document.getElementById("category").addEventListener("change", function() {
  const category = this.value;
  const subcatSelect = document.getElementById("subcategory");
  subcatSelect.innerHTML = ""; // Clear old options

  if (subcategoryMap[category]) {
    subcatSelect.disabled = false;
    subcatSelect.innerHTML = `<option value="">-- Select --</option>`;
    subcategoryMap[category].forEach(sub => {
      const opt = document.createElement("option");
      opt.value = sub;
      opt.textContent = sub;
      subcatSelect.appendChild(opt);
    });
  } else {
    subcatSelect.disabled = true;
    subcatSelect.innerHTML = `<option value="">-- Select Category First --</option>`;
  }
});
</script>
